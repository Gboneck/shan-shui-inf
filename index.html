<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>{Shan, Shui}*</title>
<meta name="description" content="A procedurally generated, infinitely scrolling Chinese landscape painting, drawn in SVG in your browser." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  /* Layout: the painting is one endless handscroll band filling the window;
     thin ink-line controls float in the top-left corner, as in the original. */
  :root {
    --paper: #fff2d9; /* tint multiplied with the greyscale paper texture */
    --paper-flat: #f2e5cb; /* the same paper as one flat colour */
    --ink: rgba(0, 0, 0, 0.58); /* control text */
    --line: rgba(0, 0, 0, 0.36); /* control borders */
    --wash: rgba(0, 0, 0, 0.08); /* hover and pressed fill */
    --panel: rgba(244, 234, 211, 0.94);
    --seal: #b3382c; /* vermilion seal paste, the one accent */
    --ins: rgba(36, 30, 26, 0.86); /* inscription ink */
    --seal-cut: #ffffff; /* paper showing through a carved seal */
    --font-ui: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --font-zh: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "KaiTi", "BiauKai", "DFKai-SB", serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #262d3d;
      --paper-flat: #1e2432;
      --ink: rgba(236, 230, 214, 0.72);
      --line: rgba(236, 230, 214, 0.38);
      --wash: rgba(236, 230, 214, 0.1);
      --panel: rgba(28, 33, 46, 0.94);
      --seal: #c0493b;
      --ins: rgba(234, 228, 210, 0.84);
      --seal-cut: #1e2432;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #262d3d;
    --paper-flat: #1e2432;
    --ink: rgba(236, 230, 214, 0.72);
    --line: rgba(236, 230, 214, 0.38);
    --wash: rgba(236, 230, 214, 0.1);
    --panel: rgba(28, 33, 46, 0.94);
    --seal: #c0493b;
    --ins: rgba(234, 228, 210, 0.84);
    --seal-cut: #1e2432;
    color-scheme: dark;
  }
  /* A chosen painting style decides the palette. */
  :root[data-style="ink"] {
    --paper: #fff2d9;
    --paper-flat: #f2e5cb;
    --ink: rgba(0, 0, 0, 0.58);
    --line: rgba(0, 0, 0, 0.36);
    --wash: rgba(0, 0, 0, 0.08);
    --panel: rgba(244, 234, 211, 0.94);
    --seal: #b3382c;
    --ins: rgba(36, 30, 26, 0.86);
    --seal-cut: #ffffff;
    color-scheme: light;
  }
  :root[data-style="qinglu"] {
    --paper: #fdebc6;
    --paper-flat: #efdcb6;
    --ink: rgba(20, 16, 8, 0.6);
    --line: rgba(20, 16, 8, 0.36);
    --wash: rgba(20, 16, 8, 0.08);
    --panel: rgba(240, 227, 196, 0.94);
    --seal: #b3382c;
    --ins: rgba(36, 30, 22, 0.86);
    --seal-cut: #ffffff;
    color-scheme: light;
  }
  :root[data-style="qianjiang"] {
    --paper: #ffefd4;
    --paper-flat: #f3e1c4;
    --ink: rgba(24, 12, 6, 0.6);
    --line: rgba(24, 12, 6, 0.36);
    --wash: rgba(24, 12, 6, 0.08);
    --panel: rgba(245, 230, 206, 0.94);
    --seal: #b3382c;
    --ins: rgba(40, 28, 22, 0.86);
    --seal-cut: #ffffff;
    color-scheme: light;
  }
  :root[data-style="snow"] {
    --paper: #cfcec7;
    --paper-flat: #c2c1ba;
    --ink: rgba(10, 12, 18, 0.66);
    --line: rgba(10, 12, 18, 0.4);
    --wash: rgba(10, 12, 18, 0.08);
    --panel: rgba(214, 213, 207, 0.95);
    --seal: #b3382c;
    --ins: rgba(22, 24, 30, 0.86);
    --seal-cut: #ffffff;
    color-scheme: light;
  }
  :root[data-style="night"] {
    --paper: #262d3d;
    --paper-flat: #1e2432;
    --ink: rgba(236, 230, 214, 0.72);
    --line: rgba(236, 230, 214, 0.38);
    --wash: rgba(236, 230, 214, 0.1);
    --panel: rgba(28, 33, 46, 0.94);
    --seal: #c0493b;
    --ins: rgba(234, 228, 210, 0.84);
    --seal-cut: #1e2432;
    color-scheme: dark;
  }

  [hidden] {
    display: none !important;
  }
  .artifact-only {
    display: none;
  }
  .artifact .artifact-only {
    display: inline;
  }
  html,
  body {
    height: 100%;
  }
  html {
    background: var(--paper-flat);
  }
  body {
    margin: 0;
    position: relative;
    overflow: hidden;
    background: var(--paper-flat);
    color: var(--ink);
    font: 12px/1.45 var(--font-ui);
    -webkit-tap-highlight-color: transparent;
  }

  /* Painting layers. Paper, sky and ink all live inside #cam, a wide strip
     of the world, so the ink can multiply onto the paper. #stage scrolls
     across the strip: browsers move a scroll offset without repainting or
     re-layering, which a transform on this much SVG does not get. */
  #cam {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
  }
  #paperTex {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background-color: var(--paper);
    background-repeat: repeat;
    background-size: 512px 512px;
    background-blend-mode: multiply;
  }
  #sky {
    position: absolute;
    left: 0;
    pointer-events: none;
  }
  #moonTrack {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    pointer-events: none;
  }
  #moon {
    position: sticky; /* stays put in the sky while the strip scrolls */
    display: block;
    border-radius: 50%;
    background: radial-gradient(circle at 42% 40%, #f6f0dc 0 55%, #e9e1c8 100%);
    box-shadow: 0 0 60px 30px rgba(243, 236, 214, 0.1), 0 0 18px 4px rgba(243, 236, 214, 0.18);
  }
  #stage {
    position: absolute;
    inset: 0;
    overflow-x: scroll;
    overflow-y: hidden;
    scrollbar-width: none;
    overscroll-behavior: none;
    touch-action: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  #stage::-webkit-scrollbar {
    display: none;
  }
  #stage.dragging {
    cursor: grabbing;
  }
  #ink,
  #ann {
    position: absolute;
    left: 0;
    top: 0;
    overflow: visible;
    mix-blend-mode: multiply;
  }
  #ann .ins {
    fill: var(--ins);
    font-family: var(--font-zh);
  }
  #ann .seal {
    fill: var(--seal);
    opacity: 0.9;
  }
  #ann .seal-line {
    fill: none;
    stroke: var(--seal);
    opacity: 0.9;
  }
  #ann .seal-cut {
    fill: var(--seal-cut);
    font-family: var(--font-zh);
  }
  #ann .seal-zhu {
    fill: var(--seal);
    font-family: var(--font-zh);
  }
  #ann .speck {
    fill: var(--seal-cut);
  }
  #band {
    position: absolute;
    left: 0;
    right: 0;
    pointer-events: none;
  }
  .banded #band {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    opacity: 0.35;
  }
  #fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Controls */
  button,
  input,
  a.btn {
    font: inherit;
    color: inherit;
  }
  .sq,
  .btn {
    box-sizing: border-box;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    border-radius: 0;
  }
  .sq:hover,
  .btn:hover,
  .sq[aria-pressed="true"],
  .sq[aria-expanded="true"] {
    background: var(--wash);
  }
  :focus-visible {
    outline: 2px solid var(--seal);
    outline-offset: 2px;
  }
  #bar {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 16px;
    display: flex;
    gap: 5px;
    z-index: 10;
  }
  .sq {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    padding: 0;
    font-size: 15px;
    line-height: 1;
  }
  .sq .glyph-sm {
    font-size: 12px;
  }
  .edge {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: min(46%, 340px);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: 22px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 5;
    padding: 0;
  }
  .edge:hover,
  .edge:focus-visible {
    opacity: 1;
    background: var(--wash);
  }
  #edgeL {
    left: 12px;
  }
  #edgeR {
    right: 12px;
  }
  .touch-only {
    display: none;
  }
  @media (hover: none) and (pointer: coarse) {
    .edge,
    .keys-section,
    .key-only {
      display: none;
    }
    .touch-only {
      display: inline;
    }
  }

  #menu {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 54px);
    left: 16px;
    width: min(330px, calc(100% - 32px));
    max-height: calc(100% - 70px - env(safe-area-inset-top, 0px));
    overflow: auto;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 14px 14px 12px;
    z-index: 10;
    display: grid;
    gap: 14px;
    overscroll-behavior: contain;
  }
  #menu section {
    display: grid;
    gap: 7px;
  }
  #menu h2 {
    margin: 0;
    font: 500 10.5px/1 var(--font-ui);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .btn {
    padding: 5px 9px;
    min-height: 30px;
    display: inline-flex;
    align-items: center;
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: progress;
  }
  #seedIn,
  #linkOut {
    flex: 1 1 120px;
    min-width: 0;
    box-sizing: border-box;
    min-height: 30px;
    padding: 4px 7px;
    background: transparent;
    border: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  #styles {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 5px;
  }
  #styles button {
    position: relative;
    display: grid;
    justify-items: center;
    gap: 2px;
    padding: 7px 2px 6px;
    background: transparent;
    border: 1px solid var(--line);
    cursor: pointer;
    min-width: 0;
  }
  #styles button:hover {
    background: var(--wash);
  }
  #styles .zh {
    font: 400 17px/1.1 var(--font-zh);
    writing-mode: horizontal-tb;
  }
  #styles .en {
    font-size: 9px;
    line-height: 1.15;
    text-align: center;
    opacity: 0.8;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  #styles button[aria-checked="true"] {
    border-color: var(--seal);
    box-shadow: inset 0 0 0 1px var(--seal);
  }
  #styles button[aria-checked="true"]::after {
    content: "";
    position: absolute;
    top: 3px;
    right: 3px;
    width: 5px;
    height: 5px;
    background: var(--seal);
  }
  label.chk {
    display: inline-flex;
    gap: 6px;
    align-items: center;
    cursor: pointer;
  }
  input[type="checkbox"],
  input[type="range"] {
    accent-color: var(--seal);
  }
  #speedIn {
    flex: 1 1 110px;
    min-width: 0;
  }
  .num {
    font-variant-numeric: tabular-nums;
    min-width: 3ch;
    text-align: right;
  }
  .keys {
    margin: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 10px;
    opacity: 0.9;
  }
  .keys dt {
    white-space: nowrap;
  }
  .keys dd {
    margin: 0;
  }
  kbd {
    font: inherit;
    border: 1px solid var(--line);
    padding: 0 4px;
  }
  .about {
    margin: 0;
    font-size: 11px;
    opacity: 0.85;
  }
  .about a {
    color: inherit;
  }

  #status {
    position: absolute;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex;
    gap: 7px;
    align-items: center;
    font-size: 11px;
    letter-spacing: 0.06em;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: 4;
  }
  #status.on {
    opacity: 0.75;
  }
  #status::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--seal);
    animation: breathe 1.4s ease-in-out infinite;
  }
  @keyframes breathe {
    50% {
      opacity: 0.25;
    }
  }
  #hint {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    transform: translateX(-50%);
    padding: 6px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    white-space: nowrap;
    max-width: calc(100% - 32px);
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 4;
    pointer-events: none;
    transition: opacity 0.8s;
  }
  #hint.gone {
    opacity: 0;
  }

  #shot {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: rgba(10, 10, 12, 0.55);
    padding: 16px;
    box-sizing: border-box;
  }
  #shot[hidden] {
    display: none;
  }
  #shot figure {
    margin: 0;
    max-width: 100%;
    display: grid;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px;
    box-sizing: border-box;
  }
  #shotImg {
    display: block;
    max-width: 100%;
    max-height: min(68vh, 680px);
    margin: 0 auto;
    border: 1px solid var(--line);
  }
  #shot figcaption {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
  }

  @media (prefers-reduced-motion: reduce) {
    #status::before {
      animation: none;
    }
    #hint,
    #status,
    .edge {
      transition: none;
    }
  }
</style>
<style id="svgTheme"></style>
</head>
<body>
<div id="stage" role="img" aria-label="A Chinese landscape painting that scrolls without end: mountains, trees, pavilions, boats and water, drawn in ink.">
  <div id="cam">
  <div id="paperTex"></div>
  <div id="sky" hidden></div>
  <div id="moonTrack"><div id="moon" hidden></div></div>
  <svg id="ink" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Blue-green (qinglü): azurite and malachite washes over the peaks -->
      <linearGradient id="qg0" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a7f93" /><stop offset="0.3" stop-color="#5f977c" />
        <stop offset="0.66" stop-color="#d9c89c" /><stop offset="1" stop-color="#ffffff" />
      </linearGradient>
      <linearGradient id="qg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3f6f8a" /><stop offset="0.45" stop-color="#7aa58a" />
        <stop offset="0.8" stop-color="#e6d6ad" /><stop offset="1" stop-color="#ffffff" />
      </linearGradient>
      <linearGradient id="qg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4f7f6c" /><stop offset="0.38" stop-color="#7ea482" />
        <stop offset="0.74" stop-color="#ddcba2" /><stop offset="1" stop-color="#ffffff" />
      </linearGradient>
      <!-- Light crimson (qianjiang): pale indigo tops over umber and ochre -->
      <linearGradient id="jg0" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a3bab5" /><stop offset="0.35" stop-color="#cdc5a6" />
        <stop offset="0.72" stop-color="#e3c3a1" /><stop offset="1" stop-color="#ffffff" />
      </linearGradient>
      <linearGradient id="jg1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#aabdb2" /><stop offset="0.4" stop-color="#d6caa9" />
        <stop offset="0.76" stop-color="#e7c7a7" /><stop offset="1" stop-color="#ffffff" />
      </linearGradient>
      <linearGradient id="jg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#b5c5bd" /><stop offset="0.45" stop-color="#ded2b3" />
        <stop offset="0.8" stop-color="#eaccb2" /><stop offset="1" stop-color="#ffffff" />
      </linearGradient>
      <filter id="f-dist-qinglu" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.55 0 0 0 0.25  0 0.7 0 0 0.22  0 0 0.85 0 0.17  0 0 0 1 0" />
      </filter>
      <!-- Moonlight: white paper becomes night, grey ink becomes pale light -->
      <filter id="f-night" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="-0.214 -0.720 -0.073 0 1.164  -0.214 -0.720 -0.073 0 1.191  -0.208 -0.701 -0.071 0 1.223  0 0 0 1 0" />
      </filter>
    </defs>
    <g id="inkWorld"></g>
  </svg>
  <svg id="ann" xmlns="http://www.w3.org/2000/svg"><g id="annWorld"></g></svg>
  </div>
</div>
<div id="band"></div>
<canvas id="fx" hidden aria-hidden="true"></canvas>

<button class="edge" id="edgeL" type="button" title="Travel left" aria-label="Travel left">&#x3008;</button>
<button class="edge" id="edgeR" type="button" title="Travel right" aria-label="Travel right">&#x3009;</button>

<div id="bar">
  <button class="sq" id="menuBtn" type="button" title="Settings" aria-label="Settings" aria-expanded="false" aria-controls="menu"><span>&#x2630;</span></button>
  <button class="sq" id="driftBtn" type="button" title="Drift (Space)" aria-label="Drift" aria-pressed="false"><span class="glyph-sm">&#x25b6;</span></button>
  <a class="sq" id="srcBtn" href="https://github.com/LingDong-/shan-shui-inf" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub"><span class="glyph-sm">&lt;/&gt;</span></a>
</div>

<div id="menu" hidden>
  <section aria-labelledby="h-seed">
    <h2 id="h-seed">Seed</h2>
    <form class="row" id="seedForm">
      <input id="seedIn" name="seed" title="Random seed" aria-label="Random seed" autocomplete="off" spellcheck="false" />
      <button class="btn" type="submit">Generate</button>
      <button class="btn" type="button" id="randBtn" title="New random seed">Random</button>
    </form>
  </section>
  <section aria-labelledby="h-style">
    <h2 id="h-style">Style</h2>
    <div id="styles" role="radiogroup" aria-labelledby="h-style"></div>
  </section>
  <section aria-labelledby="h-motion">
    <h2 id="h-motion">Travel</h2>
    <div class="row">
      <label class="chk"><input type="checkbox" id="driftChk" /> Drift</label>
      <input type="range" id="speedIn" min="8" max="240" step="4" aria-label="Drift speed" />
      <span class="num" id="speedOut"></span>
    </div>
    <div class="row">
      <span>At <span class="num" id="posOut">0</span></span>
      <button class="btn" type="button" id="startBtn">Back to start</button>
      <button class="btn" type="button" id="fsBtn">Full screen</button>
    </div>
    <label class="chk"><input type="checkbox" id="insChk" /> Show inscriptions and seals</label>
  </section>
  <section aria-labelledby="h-save">
    <h2 id="h-save">Save</h2>
    <div class="row">
      <button class="btn" type="button" id="shotBtn">Snapshot PNG</button>
      <button class="btn" type="button" id="svgBtn" data-download>Download SVG</button>
      <button class="btn" type="button" id="linkBtn" data-share>Copy link</button>
    </div>
    <input id="linkOut" hidden readonly aria-label="Link to this view" />
  </section>
  <section class="keys-section" aria-labelledby="h-keys">
    <h2 id="h-keys">Keys</h2>
    <dl class="keys">
      <dt>Drag, scroll</dt><dd>travel along the scroll</dd>
      <dt><kbd>&larr;</kbd> <kbd>&rarr;</kbd></dt><dd>travel while held</dd>
      <dt><kbd>Space</kbd></dt><dd>drift on or off</dd>
      <dt><kbd>F</kbd></dt><dd>full screen</dd>
    </dl>
  </section>
  <p class="about">Generative landscape by <a href="https://github.com/LingDong-/shan-shui-inf" target="_blank" rel="noopener">Lingdong Huang</a>, MIT licence. Poems quoted from Tang and Song poets.</p>
</div>

<div id="status" aria-hidden="true">painting</div>
<div id="hint">Drag or scroll to travel<span class="key-only"> &middot; Space to drift</span><span class="touch-only"> &middot; &#x25b6; to drift</span></div>

<div id="shot" hidden role="dialog" aria-modal="true" aria-label="Snapshot">
  <figure>
    <img id="shotImg" alt="Snapshot of the current view of the landscape" />
    <figcaption>
      <span data-download><a class="btn" id="shotPng" href="#">Download PNG</a></span>
      <span class="artifact-only">Right-click or long-press the image to save it.</span>
      <button class="btn" type="button" id="shotClose">Close</button>
    </figcaption>
  </figure>

          if (ny < -h * cho + hoff) {
            ny = -h * cho + hoff;

              flat[flat.length - 1].push([nx, ny]);

          }
        },
      });
      var grlist1 = [];
      var grlist2 = [];
      for (var i = 0; i < flat.length; i += 2) {
        if (flat[i].length >= 2) {
          grlist1.push(flat[i][0]);
          grlist2.push(flat[i][flat[i].length - 1]);

      }
      /*       for (var i = 0; i < ptlist.length; i++){
        canv += poly(ptlist[i],{xof:xoff,yof:yoff,str:"red",fil:"none",wid:2})

 */

        var xmax;
        var ymin;
        var ymax;
        for (var i = 0; i < plist.length; i++) {
          if (xmin == undefined || plist[i][0] < xmin) {
            xmin = plist[i][0];
          }
          if (xmax == undefined || plist[i][0] > xmax) {
            xmax = plist[i][0];
          }
          if (ymin == undefined || plist[i][1] < ymin) {
            ymin = plist[i][1];
          }
          if (ymax == undefined || plist[i][1] > ymax) {
            ymax = plist[i][1];
          }
        }
        return { xmin: xmin, xmax: xmax, ymin: ymin, ymax: ymax };
      };

      canv += this.flatDec(xoff, yoff, bound(grlist));

      return canv;

    this.distMount = function(xoff, yoff, seed, args) {
      var args = args != undefined ? args : {};

      var seg = args.seg != undefined ? args.seg : 5;

      var canv = "";
      var span = 10;

      var ptlist = [];

      for (var i = 0; i < len / span / seg; i++) {
        ptlist.push([]);
        for (var j = 0; j < seg + 1; j++) {
          var tran = function(k) {
            return [
              xoff + k * span,
              yoff -
                hei *
                  Noise.noise(k * 0.05, seed) *
                  Math.pow(Math.sin((Math.PI * k) / (len / span)), 0.5),
            ];
          };
          ptlist[ptlist.length - 1].push(tran(i * seg + j));
        }
        for (var j = 0; j < seg / 2 + 1; j++) {
          var tran = function(k) {
            return [
              xoff + k * span,
              yoff +
                24 *
                  Noise.noise(k * 0.05, 2, seed) *
                  Math.pow(Math.sin((Math.PI * k) / (len / span)), 1),
            ];
          };
          ptlist[ptlist.length - 1].unshift(tran(i * seg + j * 2));
        }
      }
      for (var i = 0; i < ptlist.length; i++) {
        var getCol = function(x, y) {
          var c = (Noise.noise(x * 0.02, y * 0.02, yoff) * 55 + 200) | 0;
          return "rgb(" + c + "," + c + "," + c + ")";
        };
        canv += poly(ptlist[i], {
          fil: getCol(...ptlist[i][ptlist[i].length - 1]),
          str: "none",
          wid: 1,

          area: 100,
          convex: true,
          optimize: false,
        });

          var m = PolyTools.midPt(T[k]);
          var co = getCol(m[0], m[1]);
          canv += poly(T[k], { fil: co, str: co, wid: 1 });
        }
      }
      return canv;
    };

  function frame(t) {
    rafId = 0;
    var dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
    lastT = t;
    var x0 = cam.x;
    if (!drag) {
      if (cam.glide) {
        var g = cam.glide * (1 - Math.exp(-dt * 9));
        if (Math.abs(cam.glide - g) < 0.25) g = cam.glide;
        cam.x += g;
        cam.glide -= g;
      }
      if (cam.vel) {
        cam.x += cam.vel * dt;
        cam.vel *= Math.exp(-dt * 2.4);
        if (Math.abs(cam.vel) < 3) cam.vel = 0;
      }
      var target = cam.keyDir * 650;
      if (cam.keyVel || target) {
        cam.keyVel += (target - cam.keyVel) * (1 - Math.exp(-dt * 7));
        if (!target && Math.abs(cam.keyVel) < 3) cam.keyVel = 0;
        cam.x += cam.keyVel * dt;
      }
      if (cam.drift) cam.x += cam.speed * dt;
    }
    var dx = cam.x - x0;
    if (dx) cam.dir = dx > 0 ? 1 : -1;
    applyCamera();
    if (dirty || Math.abs(cam.x - lastRefreshX) > 60 || (dx && t - lastRefreshT > 400)) refresh();
    processInserts(dx ? 6 : 24);
    fxStep(dt, dx);

    var moving = cam.glide || cam.vel || cam.keyDir || cam.keyVel || cam.drift || drag;
    if (moving && cam.drift && t - lastUrlT > 3000) {
      lastUrlT = t;
      writeUrl();
    }
    if (moving || insertQueue.length || dirty || fx.on) kick();
    else scheduleUrl();
  }

  function glideBy(units) {
    cam.vel = 0;
    cam.glide += units;
    kick();
  }

  // ---------- input ----------
  var drag = null;
  var stage = $("stage");
  // Only this script scrolls the stage; if something else does (find in
  // page, focus), follow it.
  stage.addEventListener("scroll", function() {
    if (lastScroll !== null && Math.abs(stage.scrollLeft - lastScroll) > 2 && !rebasing) {
      cam.x = base.x + stage.scrollLeft / view.s;
      lastScroll = stage.scrollLeft;
      cam.glide = cam.vel = 0;
      dirty = true;
      kick();
    }
  });
  stage.addEventListener("pointerdown", function(e) {
    if (e.button !== 0) return;
    try {
      stage.setPointerCapture(e.pointerId);
    } catch (err) {}
    drag = { id: e.pointerId, x: e.clientX, hist: [[e.timeStamp, e.clientX]] };
    cam.glide = 0;
    cam.vel = 0;
    stage.classList.add("dragging");
    dismissHint();
    kick();
  });
  stage.addEventListener("pointermove", function(e) {
    if (!drag || e.pointerId !== drag.id) return;
    cam.x -= (e.clientX - drag.x) / view.s;
    drag.x = e.clientX;
    drag.hist.push([e.timeStamp, e.clientX]);
    if (drag.hist.length > 8) drag.hist.shift();
    kick();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var h = drag.hist;
    var a = h[0],
      b = h[h.length - 1];
    var span = b[0] - a[0];
    if (span > 0 && e.timeStamp - b[0] < 80) {
      cam.vel = Math.max(-5000, Math.min(5000, -((b[1] - a[1]) / span) * 1000 / view.s));
    }
    drag = null;
    stage.classList.remove("dragging");
    kick();
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  window.addEventListener(
    "wheel",
    function(e) {
      if (e.target.closest && e.target.closest("#menu, #shot")) return;
      e.preventDefault();
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (e.deltaMode == 1) d *= 16;
      else if (e.deltaMode == 2) d *= view.w;
      dismissHint();
      if (Math.abs(d) < 40) {
        cam.x += d / view.s;
        kick();
      } else glideBy(d / view.s);
    },
    { passive: false },
  );

  window.addEventListener("keydown", function(e) {
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k == "ArrowRight" || k == "ArrowLeft") {
      cam.keyDir = k == "ArrowRight" ? 1 : -1;
      cam.glide = 0;
      dismissHint();
      kick();
      e.preventDefault();
    } else if (k == "PageDown" || k == "PageUp") {
      glideBy((k == "PageDown" ? 1 : -1) * view.wu * 0.8);
      e.preventDefault();
    } else if (k == " " && !(e.target.closest && e.target.closest("button, a"))) {
      setDrift(!cam.drift);
      dismissHint();
      e.preventDefault();
    } else if (k == "Home") {
      jumpTo(0);
      e.preventDefault();
    } else if (k == "f" || k == "F") {
      toggleFullscreen();
    } else if (k == "Escape") {
      if (!$("shot").hidden) closeShot();
      else if (!$("menu").hidden) toggleMenu(false);
    }
  });
  window.addEventListener("keyup", function(e) {
    if ((e.key == "ArrowRight" && cam.keyDir == 1) || (e.key == "ArrowLeft" && cam.keyDir == -1)) {
      cam.keyDir = 0;
      kick();
    }
  });
  window.addEventListener("blur", function() {
    cam.keyDir = 0;
  });

  function jumpTo(x) {
    cam.glide = 0;
    cam.vel = 0;
    if (Math.abs(x - cam.x) < view.wu * 3) glideBy(x - cam.x);
    else {
      cam.x = x;
      dirty = true;
      kick();
    }
  }

  $("edgeL").addEventListener("click", function() {
    glideBy(-view.wu * 0.6);
  });
  $("edgeR").addEventListener("click", function() {
    glideBy(view.wu * 0.6);
  });

  var resizeQueued = false;
  window.addEventListener("resize", function() {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(function() {
      resizeQueued = false;
      layout();
      applyCamera();
      dirty = true;
      kick();
    });
  });

  // ---------- drift ----------
  function setDrift(on) {
    cam.drift = on;
    var b = $("driftBtn");
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.title = on ? "Pause drift (Space)" : "Drift (Space)";
    b.querySelector("span").textContent = on ? "❚❚" : "▶";
    $("driftChk").checked = on;
    kick();
  }

  // ---------- style ----------
  function systemDark() {
    var t = root.getAttribute("data-theme");
    if (t == "dark") return true;
    if (t == "light") return false;
    return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  }

  function applyStyle(name, chosen, save) {
    if (!(name in STYLES)) name = "ink";
    state.style = name;
    if (chosen) state.styleChosen = true;
    var st = STYLES[name];
    root.setAttribute("data-style", name);
    themeCss.textContent = st.css.replace(/\$/g, "#ink");
    inkEl.style.mixBlendMode = st.inkBlend;
    inkEl.style.filter = st.inkFilter || "";
    annEl.style.mixBlendMode = st.annBlend;
    placeSky();
    fxSet(!!st.snow);
    document.querySelectorAll("#styles button").forEach(function(b) {
      b.setAttribute("aria-checked", b.dataset.style == name ? "true" : "false");
      b.tabIndex = b.dataset.style == name ? 0 : -1;
    });
    if (save) {
      savePrefs();
      scheduleUrl();
    }
  }

  function skyGradient(st, dir) {
    return (
      "linear-gradient(" +
      dir +
      "," +
      st.sky.stops
        .map(function(s) {
          return s[1] + " " + s[0] * 100 + "%";
        })
        .join(",") +
      ")"
    );
  }

  function placeSky() {
    var st = STYLES[state.style || "ink"];
    skyEl.style.top = view.top + "px";
    skyEl.style.height = view.bandH + "px";
    if (st.sky) {
      skyEl.style.backgroundImage = skyGradient(st, "to bottom");
      skyEl.style.mixBlendMode = st.sky.blend;
      skyEl.hidden = false;
    } else {
      skyEl.hidden = true;
    }
    if (st.sky && st.sky.moon) {
      var m = st.sky.moon;
      var r = m.r * view.bandH;
      moonEl.style.width = moonEl.style.height = 2 * r + "px";
      moonEl.style.left = m.x * view.w - r + "px";
      moonEl.style.marginTop = view.top + m.y * view.bandH - r + "px";
      moonEl.hidden = false;
    } else {
      moonEl.hidden = true;
    }
  }

  // Follow the viewer's light/dark setting until they pick a style.
  function followSystem() {
    if (!state.styleChosen) applyStyle(systemDark() ? "night" : "ink", false);
  }
  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener && mq.addEventListener("change", followSystem);
  }
  new MutationObserver(followSystem).observe(root, { attributes: true, attributeFilter: ["data-theme"] });

  // ---------- snow ----------
  var fx = { enabled: false, on: false, flakes: [], ctx: null, w: 0, h: 0, dpr: 1, t: 0 };
  var fxCanvas = $("fx");
  function fxResize() {
    fx.dpr = Math.min(2, window.devicePixelRatio || 1);
    fx.w = view.w;
    fx.h = view.h;
    fxCanvas.width = Math.round(fx.w * fx.dpr);
    fxCanvas.height = Math.round(fx.h * fx.dpr);
    fx.ctx = fxCanvas.getContext("2d");
    if (fx.enabled) {
      fxSeed();
      fxDraw();
    }
  }
  function fxSeed() {
    var n = Math.round(Math.min(420, (fx.w * fx.h) / 5200));
    fx.flakes = [];
    for (var i = 0; i < n; i++) {
      var z = Math.random();
      fx.flakes.push({
        x: Math.random() * fx.w,
        y: Math.random() * fx.h,
        z: z,
        r: 0.5 + z * 1.9,
        vy: 14 + z * 46,
        ph: Math.random() * 6.28,
      });
    }
  }
  // With reduced motion the flakes are drawn once and stay still.
  function fxSet(on) {
    fx.enabled = on;
    fx.on = on && !REDUCED;
    fxCanvas.hidden = !on;
    if (on) {
      fxSeed();
      fxDraw();
      kick();
    } else if (fx.ctx) fx.ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  }
  function fxStep(dt, dx) {
    if (!fx.on) return;
    fx.t += dt;
    var shift = dx * view.s;
    fx.flakes.forEach(function(f) {
      f.y += f.vy * dt;
      f.x += (Math.sin(fx.t * 0.7 + f.ph) * 8 + 6) * dt * (0.4 + f.z) - shift * (0.3 + f.z * 0.9);
      if (f.y > fx.h + 4) {
        f.y = -4;
        f.x = Math.random() * fx.w;
      }
      if (f.x < -6) f.x += fx.w + 12;
      else if (f.x > fx.w + 6) f.x -= fx.w + 12;
    });
    fxDraw();
  }
  function fxDraw(ctx, sx, sy, ox, oy) {
    ctx = ctx || fx.ctx;
    if (!ctx) return;
    sx = sx || fx.dpr;
    sy = sy || fx.dpr;
    ox = ox || 0;
    oy = oy || 0;
    if (ctx === fx.ctx) ctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    fx.flakes.forEach(function(f) {
      ctx.globalAlpha = 0.45 + f.z * 0.5;
      ctx.beginPath();
      ctx.arc((f.x - ox) * sx, (f.y - oy) * sy, f.r * sx, 0, 6.2832);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // ---------- URL ----------
  var urlTimer = 0;
  function scheduleUrl() {
    if (ARTIFACT) return;
    clearTimeout(urlTimer);
    urlTimer = setTimeout(writeUrl, 500);
  }
  function shareUrl() {
    var q = "?seed=" + encodeURIComponent(state.seed) + "&x=" + Math.round(cam.x);
    if (state.styleChosen) q += "&style=" + state.style;
    return location.origin + location.pathname + q;
  }
  function writeUrl() {
    if (ARTIFACT) return;
    try {
      history.replaceState(null, "", shareUrl());
    } catch (e) {}
  }

  // ---------- seeds ----------
  function setSeed(seed, x) {
    seed = String(seed).trim() || String(Date.now());
    state.seed = seed;
    $("seedIn").value = seed;
    epoch++;
    live.ink.concat(live.ann).forEach(function(it) {
      it.el = null;
    });
    live = { ink: [], ann: [] };
    inkWorld.textContent = "";
    annWorld.textContent = "";
    plans.clear();
    cache.clear();
    cacheSize = 0;
    insertQueue = [];
    cam.x = x || 0;
    cam.glide = cam.vel = 0;
    rebase();
    applyCamera();
    sendInit();
    writeUrl();
    kick();
  }

  // ---------- status & hint ----------
  var statusTimer = 0;
  function showStatus(on) {
    var el = $("status");
    clearTimeout(statusTimer);
    if (on) {
      statusTimer = setTimeout(function() {
        el.classList.add("on");
      }, 250);
    } else el.classList.remove("on");
  }
  var hintGone = false;
  function dismissHint() {
    if (hintGone) return;
    hintGone = true;
    $("hint").classList.add("gone");
  }
  setTimeout(dismissHint, 9000);

  // ---------- menu ----------
  function toggleMenu(open) {
    var m = $("menu");
    open = open === undefined ? m.hidden : open;
    m.hidden = !open;
    $("menuBtn").setAttribute("aria-expanded", open ? "true" : "false");
    $("menuBtn").querySelector("span").textContent = open ? "✕" : "☰";
    if (open) {
      dismissHint();
      showPos(true);
    }
  }
  $("menuBtn").addEventListener("click", function() {
    toggleMenu();
  });
  $("driftBtn").addEventListener("click", function() {
    setDrift(!cam.drift);
    dismissHint();
  });
  $("driftChk").addEventListener("change", function(e) {
    setDrift(e.target.checked);
  });
  $("speedIn").value = cam.speed;
  $("speedOut").textContent = cam.speed;
  $("speedIn").addEventListener("input", function(e) {
    cam.speed = +e.target.value;
    $("speedOut").textContent = cam.speed;
    savePrefs();
  });
  $("insChk").checked = state.ins;
  $("insChk").addEventListener("change", function(e) {
    state.ins = e.target.checked;
    annEl.style.display = state.ins ? "" : "none";
    savePrefs();
    dirty = true;
    kick();
  });
  $("seedForm").addEventListener("submit", function(e) {
    e.preventDefault();
    setSeed($("seedIn").value, 0);
  });
  $("randBtn").addEventListener("click", function() {
    setSeed(String(Date.now()), 0);
  });
  $("startBtn").addEventListener("click", function() {
    jumpTo(0);
  });

  var styleWrap = $("styles");
  STYLE_ORDER.forEach(function(name) {
    var st = STYLES[name];
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "radio");
    b.dataset.style = name;
    b.innerHTML = '<span class="zh" lang="zh-Hant">' + st.zh + '</span><span class="en">' + st.en + "</span>";
    b.addEventListener("click", function() {
      applyStyle(name, true, true);
    });
    styleWrap.appendChild(b);
  });
  styleWrap.addEventListener("keydown", function(e) {
    var d = e.key == "ArrowRight" || e.key == "ArrowDown" ? 1 : e.key == "ArrowLeft" || e.key == "ArrowUp" ? -1 : 0;
    if (!d) return;
    e.preventDefault();
    e.stopPropagation();
    var i = (STYLE_ORDER.indexOf(state.style) + d + STYLE_ORDER.length) % STYLE_ORDER.length;
    applyStyle(STYLE_ORDER[i], true, true);
    styleWrap.querySelector('[data-style="' + STYLE_ORDER[i] + '"]').focus();
  });

  var fsOK = document.fullscreenEnabled && root.requestFullscreen;
  $("fsBtn").hidden = !fsOK;
  function toggleFullscreen() {
    if (!fsOK) return;
    var p = document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen();
    if (p && p.catch) p.catch(function() {});
  }
  $("fsBtn").addEventListener("click", toggleFullscreen);

  if (ARTIFACT) {
    root.classList.add("artifact");
    document.querySelectorAll("[data-download], [data-share]").forEach(function(el) {
      el.hidden = true;
    });
  }
  $("linkBtn").addEventListener("click", function() {
    var url = shareUrl();
    var out = $("linkOut");
    function shown() {
      out.hidden = false;
      out.value = url;
      out.select();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(
        function() {
          flash($("linkBtn"), "Copied");
        },
        shown,
      );
    } else shown();
  });
  function flash(btn, text) {
    var old = btn.textContent;
    btn.textContent = text;
    setTimeout(function() {
      btn.textContent = old;
    }, 1400);
  }

  // ---------- export ----------
  function tokens() {
    var cs = getComputedStyle(root);
    var g = function(n) {
      return cs.getPropertyValue(n).trim();
    };
    return { paper: g("--paper"), ins: g("--ins"), seal: g("--seal"), cut: g("--seal-cut"), zh: g("--font-zh") };
  }

  function visibleItems(layer) {
    var L = cam.x,
      R = cam.x + view.wu;
    return live[layer].filter(function(it) {
      return inRange(it, L, R);
    });
  }

  function annCss(tk) {
    return (
      ".ins{fill:" + tk.ins + ";font-family:" + tk.zh + "}" +
      ".seal{fill:" + tk.seal + ";opacity:.9}" +
      ".seal-line{fill:none;stroke:" + tk.seal + ";opacity:.9}" +
      ".seal-cut{fill:" + tk.cut + ";font-family:" + tk.zh + "}" +
      ".seal-zhu{fill:" + tk.seal + ";font-family:" + tk.zh + "}" +
      ".speck{fill:" + tk.cut + "}"
    );
  }

  // Builds a standalone SVG of the current view. The paper and sky are
  // optional so a PNG can draw them on the canvas instead.
  function buildSvg(o) {
    var st = STYLES[state.style];
    var tk = tokens();
    var x0 = +cam.x.toFixed(2),
      wu = +view.wu.toFixed(2);
    var out = [
      '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="' +
        Math.round(o.w) +
        '" height="' +
        Math.round(o.h) +
        '" viewBox="' +
        x0 +
        " 0 " +
        wu +
        " " +
        H +
        '">',
    ];
    out.push(inkEl.querySelector("defs").outerHTML);
    out.push("<style>" + st.css.replace(/\$/g, "") + annCss(tk) + "</style>");
    if (o.paper) {
      out.push('<rect x="' + x0 + '" y="0" width="' + wu + '" height="' + H + '" fill="' + tk.paper + '"/>');
      if (paperCanvas) {
        var t = 512 / view.s;
        var off = (((x0 * view.s) % 512) + 512) % 512;
        out.push(
          '<pattern id="ptex" patternUnits="userSpaceOnUse" width="' + t + '" height="' + t +
            '" patternTransform="translate(' + (x0 - off / view.s) + "," + -view.top / view.s + ')">' +
            '<image width="' + t + '" height="' + t + '" preserveAspectRatio="none" href="' +
            paperCanvas.toDataURL("image/png") + '"/></pattern>' +
            '<rect x="' + x0 + '" y="0" width="' + wu + '" height="' + H +
            '" fill="url(#ptex)" style="mix-blend-mode:multiply"/>',
        );
      }
    }
    if (o.sky && st.sky) {
      out.push(
        '<linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">' +
          st.sky.stops
            .map(function(s) {
              return '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"/>';
            })
            .join("") +
          '</linearGradient><rect x="' + x0 + '" y="0" width="' + wu + '" height="' + H +
          '" fill="url(#skyg)" style="mix-blend-mode:' + st.sky.blend + '"/>',
      );
      if (st.sky.moon) out.push(moonSvg(st.sky.moon, x0, wu));
    }
    out.push(
      '<g style="mix-blend-mode:' + st.inkBlend + '"' + (st.inkFilter ? ' filter="' + st.inkFilter + '"' : "") + ">",
    );
    visibleItems("ink").forEach(function(it) {
      var d = cache.get(it.id);
      out.push('<g class="it it-' + it.tag + '">' + (typeof d == "string" ? d : it.el.innerHTML) + "</g>");
    });
    out.push("</g>");
    if (o.ann && state.ins) {
      out.push('<g style="mix-blend-mode:' + st.annBlend + '">');
      visibleItems("ann").forEach(function(it) {
        out.push('<g class="it it-' + it.tag + '">' + it.el.innerHTML + "</g>");
      });
      out.push("</g>");
    }
    out.push("</svg>");
    return out.join("");
  }

  function moonSvg(m, x0, wu) {
    var cx = x0 + m.x * wu,
      cy = m.y * H,
      r = m.r * H;
    return (
      '<radialGradient id="mglow"><stop offset="0" stop-color="#f3ecd6" stop-opacity=".22"/>' +
      '<stop offset="1" stop-color="#f3ecd6" stop-opacity="0"/></radialGradient>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r * 5 + '" fill="url(#mglow)"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#efe8d2"/>'
    );
  }

  function loadImage(url) {
    return new Promise(function(res, rej) {
      var img = new Image();
      img.onload = function() {
        res(img);
      };
      img.onerror = rej;
      img.src = url;
    });
  }

  function drawAnno(ctx, a, k, tk) {
    var X = function(x) {
      return (x - cam.x) * view.s * k;
    };
    var Y = function(y) {
      return y * view.s * k;
    };
    a.prims.forEach(function(p) {
      ctx.globalAlpha = 1;
      if (p.p == "poly") {
        ctx.beginPath();
        p.pts.forEach(function(v, i) {
          i ? ctx.lineTo(X(v[0]), Y(v[1])) : ctx.moveTo(X(v[0]), Y(v[1]));
        });
        ctx.closePath();
        if (p.k == "seal-line") {
          ctx.globalAlpha = 0.9;
          ctx.strokeStyle = tk.seal;
          ctx.lineWidth = p.sw * view.s * k;
          ctx.stroke();
        } else {
          ctx.globalAlpha = p.k == "seal" ? 0.9 : 1;
          ctx.fillStyle = p.k == "seal" ? tk.seal : tk.cut;
          ctx.fill();
        }
      } else {
        ctx.globalAlpha = p.o;
        ctx.fillStyle = p.k == "ins" ? tk.ins : p.k == "seal-cut" ? tk.cut : tk.seal;
        ctx.font = p.w + " " + (p.s * view.s * k).toFixed(2) + "px " + tk.zh;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.t, X(p.x), Y(p.y));
      }
    });
    ctx.globalAlpha = 1;
  }

  var shotURL = null;
  var shotSvgURL = null;
  async function snapshot() {
    var btn = $("shotBtn");
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = "Rendering…";
    try {
      var st = STYLES[state.style];
      var tk = tokens();
      var k = Math.max(1, Math.min(2, 4096 / view.w));
      var W = Math.round(view.w * k),
        Hp = Math.round(view.bandH * k);
      var c = document.createElement("canvas");
      c.width = W;
      c.height = Hp;
      var ctx = c.getContext("2d");
      ctx.fillStyle = tk.paper;
      ctx.fillRect(0, 0, W, Hp);
      if (paperCanvas) {
        var pat = ctx.createPattern(paperCanvas, "repeat");
        var off = (((cam.x * view.s) % 512) + 512) % 512;
        pat.setTransform(new DOMMatrix().scale(k).translate(-off, -view.top));
        ctx.globalCompositeOperation = "multiply";
        ctx.fillStyle = pat;
        ctx.fillRect(0, 0, W, Hp);
      }
      if (st.sky) {
        var g = ctx.createLinearGradient(0, 0, 0, Hp);
        st.sky.stops.forEach(function(s) {
          g.addColorStop(s[0], s[1]);
        });
        ctx.globalCompositeOperation = st.sky.blend == "multiply" ? "multiply" : "source-over";
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, Hp);
        if (st.sky.moon) {
          ctx.globalCompositeOperation = "source-over";
          var mimg = await loadImage(
            URL.createObjectURL(
              new Blob(
                [
                  '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + Hp + '" viewBox="0 0 ' +
                    view.wu + " " + H + '">' + moonSvg(st.sky.moon, 0, view.wu) + "</svg>",
                ],
                { type: "image/svg+xml" },
              ),
            ),
          );
          ctx.drawImage(mimg, 0, 0, W, Hp);
        }
      }
      var svg = buildSvg({ w: W, h: Hp, paper: false, sky: false, ann: false });
      var url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
      var img = await loadImage(url);
      URL.revokeObjectURL(url);
      ctx.globalCompositeOperation = st.inkBlend == "multiply" ? "multiply" : "source-over";
      ctx.drawImage(img, 0, 0, W, Hp);
      if (state.ins) {
        try {
          await document.fonts.load("20px " + tk.zh, "山水");
        } catch (e) {}
        ctx.globalCompositeOperation = st.annBlend == "multiply" ? "multiply" : "source-over";
        visibleItems("ann").forEach(function(it) {
          var a = cache.get(it.id);
          if (a && a.prims) drawAnno(ctx, a, k, tk);
        });
      }
      if (st.snow) {
        ctx.globalCompositeOperation = "source-over";
        fxDraw(ctx, k, k, 0, view.top);
      }
      var blob = await new Promise(function(res) {
        c.toBlob(res, "image/png");
      });
      if (!blob) throw new Error("empty");
      if (shotURL) URL.revokeObjectURL(shotURL);
      shotURL = URL.createObjectURL(blob);
      if (shotSvgURL) URL.revokeObjectURL(shotSvgURL);
      shotSvgURL = null;
      openShot(shotURL);
    } catch (e) {
      console.warn(e);
      flash(btn, "Snapshot failed");
    } finally {
      btn.disabled = false;
      if (btn.textContent == "Rendering…") btn.textContent = old;
    }
  }

  function fileBase() {
    return "shan-shui-" + state.seed.replace(/[^\w-]+/g, "_").slice(0, 40) + "-" + Math.round(cam.x);
  }
  function openShot(url) {
    $("shotImg").src = url;
    $("shotPng").href = url;
    $("shotPng").download = fileBase() + ".png";
    $("shot").hidden = false;
    $("shotClose").focus();
  }
  function closeShot() {
    $("shot").hidden = true;
    $("shotBtn").focus();
  }
  $("shotBtn").addEventListener("click", snapshot);
  $("shotClose").addEventListener("click", closeShot);
  $("shot").addEventListener("click", function(e) {
    if (e.target === $("shot")) closeShot();
  });
  $("svgBtn").addEventListener("click", function() {
    var svg = buildSvg({ w: view.w, h: view.bandH, paper: true, sky: true, ann: true });
    var url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    var a = document.createElement("a");
    a.href = url;
    a.download = fileBase() + ".svg";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function() {
      URL.revokeObjectURL(url);
    }, 4000);
  });

  // ---------- fonts ----------
  // Ask Google Fonts for just the characters the page uses.
  (function loadFonts() {
    var chars = new Set();
    var src = genSource() + STYLE_ORDER.map(function(n) {
      return STYLES[n].zh;
    }).join("") + document.title;
    (src.match(/[㐀-鿿]/g) || []).forEach(function(c) {
      chars.add(c);
    });
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href =
      "https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap&text=" +
      encodeURIComponent(Array.from(chars).join(""));
    document.head.appendChild(link);
  })();

  // A handle for tinkering from the console: add ?debug to the URL.
  if (/[?&]debug\b/.test(location.search)) {
    window.shanshui = {
      cam: cam,
      view: view,
      state: state,
      plans: plans,
      live: function() {
        return live;
      },
      jumpTo: jumpTo,
      setSeed: setSeed,
      applyStyle: applyStyle,
      setDrift: setDrift,
      kick: kick,
      planColumns: function(ks) {
        worker.postMessage({ type: "plan", epoch: epoch, ks: ks });
      },
    };
  }

  // ---------- boot ----------
  $("seedIn").value = state.seed;
  applyStyle(params.style || prefs.style || (systemDark() ? "night" : "ink"), !!(params.style || prefs.style), false);
  if (!state.ins) annEl.style.display = "none";
  layout();
  applyCamera();
  startWorker();
  if (worker && !worker.inline) sendInit();
  kick();
})();
</script>
</body>
</html>
